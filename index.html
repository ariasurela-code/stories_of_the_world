<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10333A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="World Stories">
<meta name="description" content="हर दिन एक देश की एक सच्ची, दिलचस्प कहानी। One true story from every country, every day.">
<title>Stories of the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Serif+Devanagari:wght@400;600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EEE6;--card:#FFFDF9;--ink:#1D2A2E;--muted:#667579;--line:#E1D8CA;--accent:#B5600A;--accent2:#0F4C5C;--onaccent:#fff;--shadow:0 1px 2px rgba(20,30,35,.06),0 8px 24px rgba(20,30,35,.08);
--serif:"Newsreader","Noto Serif Devanagari",Georgia,serif;--sans:"Hind",system-ui,sans-serif;--fs:19px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A20;--card:#122730;--ink:#E8EFEF;--muted:#93A8AD;--line:#24404A;--accent:#F2B34A;--accent2:#6CC1D1;--onaccent:#0C1A20;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0C1A20;--card:#122730;--ink:#E8EFEF;--muted:#93A8AD;--line:#24404A;--accent:#F2B34A;--accent2:#6CC1D1;--onaccent:#0C1A20;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 72px}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:20;transition:width .1s}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-family:var(--serif);font-size:1.45rem;font-weight:600;margin:0;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.04em}
.ctrl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:6px 14px;min-height:38px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent2);color:#fff}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:38px}
.ibtn.sq{width:38px;padding:0}
/* home */
.feature{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:20px;overflow:hidden;min-height:340px;color:#fff;background:var(--accent2);box-shadow:var(--shadow);padding:0}
.feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,25,.05) 25%,rgba(8,20,25,.88) 100%)}
.feature .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px}
.feature h2{font-family:var(--serif);font-weight:600;font-size:1.9rem;line-height:1.22;margin:8px 0 6px}
.feature p{margin:0;opacity:.92;font-size:1.02rem}
.tag{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);color:#fff}
.tag.k{background:var(--accent);color:var(--onaccent)}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin:22px 0 10px}
.filters{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.count{font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .ph{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:12px 14px 14px}
.card .meta{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card b{display:block;font-family:var(--serif);font-weight:600;font-size:1.14rem;line-height:1.3;margin:4px 0 0}
.done{color:var(--accent);font-weight:600}
.empty{color:var(--muted);padding:34px 0;text-align:center}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:.82rem}
/* reader */
.back{margin-bottom:12px}
.cover{position:relative;border-radius:20px;overflow:hidden;min-height:300px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:var(--shadow)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,25,.1) 20%,rgba(8,20,25,.9) 100%)}
.cover .in{position:relative;z-index:1;padding:90px 22px 22px}
.cover h1{font-family:var(--serif);font-weight:600;font-size:2.05rem;line-height:1.2;margin:10px 0 8px}
.cover .m{font-size:.92rem;opacity:.92}
.tools{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.lede{font-family:var(--serif);font-style:italic;font-size:calc(var(--fs) + 2px);line-height:1.55;color:var(--accent2);margin:22px 0 6px;padding-left:16px;border-left:3px solid var(--accent)}
article{margin-top:18px}
article p{font-family:var(--serif);font-size:var(--fs);line-height:1.85;margin:0 0 1.15em}
article p.first::first-letter{font-size:3.6em;float:left;line-height:.85;padding:.08em .1em 0 0;color:var(--accent);font-weight:700}
figure.inline{margin:26px -4px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
figure.inline img{display:block;width:100%;max-height:420px;object-fit:cover}
figure.inline figcaption{padding:10px 14px;font-size:.86rem;color:var(--muted)}
figure.inline figcaption a{color:var(--accent2)}
.sep{text-align:center;color:var(--accent);letter-spacing:.6em;margin:26px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:18px 0}
.box h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin:0 0 6px}
.box p{font-family:var(--serif);font-size:calc(var(--fs) - 2px);margin:0;line-height:1.7}
.box.truth{border-left:4px solid var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:0}
.facts div{background:var(--bg);border-radius:12px;padding:10px 12px}
.facts dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:2px 0 0;font-weight:500}
.src{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.src a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--bg)}
.src a:hover{border-color:var(--accent2)}
.src b{display:block;color:var(--accent2)}
.src span{font-size:.84rem;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px}
.nav button{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.nav button:last-child{text-align:right}
.nav small{display:block;color:var(--muted)}
.nav b{font-family:var(--serif);font-weight:600;font-size:.98rem;line-height:1.3;display:block}
.nav button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:no-preference){.view{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (max-width:480px){.cover h1{font-size:1.7rem}.feature h2{font-size:1.6rem}.brand{font-size:1.25rem}}
/* ===== v3 : concise home + bento slide reader ===== */
:root{--vermilion:#C8372D}
body.reading{overflow:hidden}
.wrap{padding-bottom:36px}
.seg button{padding:6px 12px}
/* ---- home ---- */
.feature{min-height:250px;border-radius:22px}
.feature h2{font-size:1.6rem;margin:8px 0 4px}
.feature p{font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--accent);color:var(--onaccent);font-weight:600;font-size:.92rem;padding:7px 16px;border-radius:99px}
.fprog{display:block;height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.fprog u{display:block;height:100%;background:#fff;border-radius:9px}
.tb{display:flex;gap:8px;margin:16px 0 14px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 12px}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:11px 0;outline:none}
.sbox:focus-within{border-color:var(--accent2)}
.sbox .x{border:0;background:none;padding:4px 6px;color:var(--muted)}
.grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{border-radius:18px;position:relative}
.card .ph{aspect-ratio:4/3}
.card .fl{position:absolute;top:8px;left:8px;max-width:calc(100% - 46px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(10,20,25,.55);backdrop-filter:blur(4px);border-radius:99px;padding:1px 8px;font-size:.78rem;color:#fff;font-weight:600}
.card .chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;color:#1a7f4b;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.card .tx{padding:10px 12px 12px}
.card b{font-size:1rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.card .meta{margin-top:4px}
.mp{display:block;height:3px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.mp u{display:block;height:100%;background:var(--accent)}
.foot{margin-top:26px}

/* ---- reader shell ---- */
.rwrap{max-width:1180px;margin:0 auto;padding:0}
.rd{height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.rtop{display:flex;align-items:center;gap:8px;flex:none}
.rtitle{flex:1;min-width:0;line-height:1.25}
.rtitle small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle b{display:block;font-family:var(--serif);font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck{flex:1;min-height:0;position:relative}
.segs{display:flex;gap:4px;flex:none}
.segs i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:background .3s,transform .3s}
.segs i.full{background:var(--accent)}
.segs i.now{background:var(--vermilion);transform:scaleY(1.5)}
.page-corners{display:flex;justify-content:space-between;align-items:center;flex:none;padding:0 3px 2px;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.page-corners span{min-width:34px;text-align:center;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.deck .slide .m,.deck .slide .s{cursor:pointer}
.deck .slide .m:active,.deck .slide .s:active{transform:scale(.99)}
.dock{display:flex;justify-content:space-between;gap:2px;flex:none}
.ib{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:4px 0;border-radius:12px;color:var(--ink)}
.ib span{font-size:1.2rem;line-height:1.25}
.ib small{font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ib:hover{background:var(--card)}
.ib.on span{color:var(--vermilion)}
.rnav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;flex:none}
.rnav>button{padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;min-height:48px}
.rnav>button#nx{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.rnav>button:disabled{opacity:.35;cursor:default}
.pc{text-align:center;line-height:1.2}
.pc b{font-family:var(--serif);font-size:1.15rem}
.pc small{display:block;color:var(--muted);font-size:.72rem}

/* ---- the bento slide ---- */
.slide{position:absolute;inset:0;display:grid;gap:10px}
.st{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(135deg,var(--accent2),#1b2f36);isolation:isolate;min-width:0;min-height:0}
.m{grid-area:m;color:#fff;margin:0}.s{grid-area:s;color:#fff;margin:0}.tt{grid-area:t}
.m::before,.s::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.38);border-radius:16px;pointer-events:none;z-index:2}
.m>img,.s>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 50%);z-index:-1;animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:.35;z-index:-2}
.stamp{position:absolute;top:12px;left:12px;z-index:3;min-width:28px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;background:var(--vermilion);color:#fff;font-family:var(--serif);font-weight:700;font-size:.82rem;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.stamp.s{position:static;vertical-align:middle;margin-right:6px;width:auto;height:24px;min-width:24px;font-size:.74rem}
.cr{position:absolute;top:12px;right:12px;z-index:3;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.66rem;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);color:#fff;text-decoration:none}
.mcap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:46px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(6,14,18,.86))}
.mcap h2{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(1.25rem,1rem + 1.4vw,2.1rem);line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.5)}
/* auto contrast: bright photo -> dark heading on light scrim */
.slide[data-tone="light"] .mcap{color:#10242b;background:linear-gradient(transparent,rgba(255,250,240,.93))}
.slide[data-tone="light"] .mcap h2{text-shadow:none}
.tt{background:var(--card);color:var(--ink);border-top:3px solid var(--vermilion);display:flex;flex-direction:column}
.tscroll{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tt .more{display:none;position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;background:linear-gradient(transparent,var(--card));text-align:center;color:var(--muted);font-size:.9rem;line-height:44px}
.tt.more .more{display:block}
.kick{font-size:.82rem;letter-spacing:.03em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap}
.tt h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;line-height:1.25;margin:0 0 10px}
.otxt p{font-family:var(--serif);font-size:calc(var(--fs) - 1px);line-height:1.75;margin:0 0 .85em}
.otxt p:last-child{margin-bottom:0}
/* layouts (desktop) */
.L1{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"m t"}
.L1r{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);grid-template-areas:"t m"}
.L2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"m t" "s t"}
.L2b{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:minmax(0,2.1fr) minmax(0,1fr);grid-template-areas:"m s" "t t"}
.L3{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"m" "t"}
.L4{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"x"}
.L4 .m{grid-area:x}
.L4 .tt{grid-area:x;align-self:end;justify-self:start;width:min(46%,540px);max-height:80%;margin:18px;z-index:2;border-top:0;border-radius:20px;background:rgba(255,251,244,.92);color:#1d2a2e;backdrop-filter:blur(6px)}
.L4.rt .tt{justify-self:end}
.L4 .kick{color:#5b6a6e}
.L4 .tt .more{background:linear-gradient(transparent,rgba(255,251,244,.95))}
.slide.L4[data-tone="light"] .tt{background:rgba(12,26,32,.86);color:#f4f1ea}
.slide.L4[data-tone="light"] .kick{color:#b9c6c9}
.slide.L4[data-tone="light"] .tt .more{background:linear-gradient(transparent,rgba(12,26,32,.95))}
/* Full-bleed single-image story tile: no side image and no text panel */
.full-slide{display:block}
.full-story-tile{position:absolute;inset:0;width:100%;height:100%;margin:0;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#17252a}
.full-story-tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 50%);z-index:0;animation:kb 16s ease-out both}
.full-story-tile .ghost{z-index:0}
.full-story-tile .stamp,.full-story-tile .cr{z-index:4}
.story-overlay{position:absolute;z-index:3;left:0;right:0;bottom:0;top:auto;max-height:76%;overflow-y:auto;padding:22px 22px 26px;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.8);scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.story-overlay .kick{color:inherit;font-size:.85rem;opacity:.96;margin-bottom:8px}
.story-overlay h2{font-family:var(--serif);font-size:clamp(1.55rem,1.15rem + 2vw,2.4rem);line-height:1.18;margin:0 0 12px;font-weight:700}
.story-overlay .otxt p{font-family:var(--serif);font-size:calc(var(--fs) - 1px);line-height:1.65;margin:0 0 .8em}
.slide[data-tone="light"] .story-overlay{color:#142329;text-shadow:0 1px 3px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.7)}
.slide[data-tone="light"] .story-overlay .kick{color:#142329}
.full-story-tile .cr{max-width:52%}
.country-ending .story-overlay{max-height:88%;padding-bottom:30px}
.country-ending .story-overlay h2{font-size:clamp(1.4rem,1.05rem + 1.7vw,2.1rem)}
.country-ending .story-overlay .otxt p{font-size:calc(var(--fs) - 2px);line-height:1.48;margin-bottom:.58em}
.country-ending .stamp{background:#0b5961}


/* 8 different opening animations (one per tile, cycling) */
.slide .m,.slide .s,.slide .tt{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.o0 .m{animation-name:oFade}.o1 .m{animation-name:oUp}.o2 .m{animation-name:oZoom}.o3 .m{animation-name:oFlip}
.o4 .m{animation-name:oLeft}.o5 .m{animation-name:oBlur}.o6 .m{animation-name:oWipe}.o7 .m{animation-name:oSpin}
.slide .s{animation-name:oZoom;animation-delay:.25s}
.slide .tt{animation-name:oText;animation-delay:.15s}
.o1 .tt,.o4 .tt,.o6 .tt{animation-name:oTextR}

const TRANSLATIONS = {"en":{"2":{"title":"The Minaret of Jam: A Mystery Among the Mountains","story":["In Ghor province, Afghanistan, the Hari Rud and Jam rivers meet near a remote valley. High among the mountains, a tall brick tower rises above the landscape.","This is the Minaret of Jam, about 65 metres tall. It was built during the Ghurid period in the twelfth century, when Ghurid power extended across parts of present-day Afghanistan, Iran, Central Asia and northern India.","The minaret is associated with Sultan Ghiyath al-Din Muhammad. Its exact date remains debated: UNESCO gives 1194, while research discussed in Encyclopaedia Iranica supports reading the inscription as 1174–75.","Its original purpose is not certain. It may have commemorated a political or military victory. Nearby remains have been linked by some scholars to Firuzkuh, a Ghurid capital, but that identification is not conclusive.","The tower has an eight-sided base and tiers of baked brick that narrow as they rise. Its exterior is decorated with intricate geometric patterns, plasterwork and bands of calligraphy.","Kufic inscriptions include royal titles and Qur’anic passages. The lower section carries the complete text of Surah Maryam, the nineteenth chapter of the Qur’an. Turquoise glazed tiles survive in one inscription band.","The remote monument entered wider archaeological study after surveys in the mid-twentieth century. It offers rare evidence of Ghurid craftsmanship, architecture and calligraphy.","In 2002, UNESCO added the Minaret of Jam and its archaeological remains to the World Heritage List. It was also placed on the List of World Heritage in Danger because of flooding, river erosion and conservation challenges.","Those risks remain real. UNESCO's 2026 reporting continued to identify seasonal floods as a serious threat. Monitoring, flood protection and other conservation work remain important, while specialists also watch the tower's inclination.","The minaret is more than an old tower: it is a remarkable record of Ghurid art and the region's cultural history. Its architectural tradition is part of the wider story of Islamic architecture across Central and South Asia."],"why":"It is famous for its height, intricate baked-brick decoration and remarkable Kufic inscriptions, including the complete text of Surah Maryam. It is one of the most important surviving monuments of Ghurid architecture.","where":"The minaret stands in Ghor province, near the meeting of the Hari Rud and Jam rivers in central Afghanistan. Its remote location makes access difficult, but it is internationally recognised as a major Afghan heritage site.","truth":"The date is disputed: UNESCO lists 1194, while scholarship discussed in Encyclopaedia Iranica supports 1174–75. The proposed link to Firuzkuh and the idea that it commemorated a victory remain interpretations, not settled facts. The site has been on UNESCO's List of World Heritage in Danger since 2002.","info":[["Capital","Kabul"],["Languages","Dari and Pashto"],["Currency","Afghani (AFN)"],["Geography","The Hindu Kush mountains shape much of the country's landscape and history"]]}},"hi":{"1":{"title":"फ़राओ का श्राप: तूतनख़ामुन की कब्र का रहस्य","story":["मिस्र के लक्सर शहर के पास एक सूखी और शांत घाटी है, जिसे आज राजाओं की घाटी कहा जाता है। हज़ारों साल पहले मिस्र के फ़राओ को यहीं दफ़नाया जाता था। पास ही प्राचीन नगर थीब्स कभी जीवन से भरा हुआ था।","1922 के आसपास पुरातत्वविद् हॉवर्ड कार्टर यहाँ कई वर्षों से खुदाई कर रहे थे। उनका लक्ष्य युवा राजा तूतनख़ामुन की कब्र ढूँढ़ना था। तूतनख़ामुन की मृत्यु लगभग 18 या 19 वर्ष की आयु में हुई थी और उसकी कब्र का स्थान अब तक नहीं मिला था।","खुदाई का खर्च धनी अंग्रेज़ लॉर्ड कार्नार्वन उठा रहे थे। लगातार असफलताओं के बाद उन्होंने कार्टर को एक आख़िरी मौसम का समय दिया। तभी एक मज़दूर को रेत के नीचे सीढ़ी का पहला पत्थर दिखाई दिया। खुदाई आगे बढ़ी तो बंद दरवाज़ा मिला।","कार्टर ने दीवार में छोटा छेद करके भीतर झाँका। मोमबत्ती की रोशनी में सोने की वस्तुएँ, रथ, संदूक और मूर्तियाँ चमक रही थीं। तीन हज़ार साल से बंद यह कब्र लगभग अछूती मिली थी। बाद में तूतनख़ामुन का प्रसिद्ध स्वर्ण मुखौटा भी दुनिया के सामने आया।","इस खोज की खबर दुनिया भर में फैल गई। कुछ महीनों बाद कार्नार्वन की काहिरा में संक्रमण के कारण मृत्यु हो गई। उनके मच्छर के काटने से बने घाव में संक्रमण हुआ था। लेकिन अख़बारों ने इसे फ़राओ के श्राप से जोड़ना शुरू कर दिया।","कहानियाँ फैलने लगीं कि कब्र खोलने वालों को रहस्यमय मौतें घेर रही हैं। किसी ने दावा किया कि कब्र की दीवार पर चेतावनी लिखी थी। इन दावों ने रहस्य को और सनसनीखेज़ बना दिया।","समय के साथ यह घटना फ़राओ के श्राप की मशहूर कथा बन गई। मगर असली खोज इससे भी अधिक महत्वपूर्ण थी: इसने प्राचीन मिस्र की कला, दफ़नाने की परंपराओं और राजसी जीवन के बारे में असाधारण जानकारी दी।"],"why":"इस कहानी में पुरातत्व की महान खोज, सोने से भरी कब्र और रहस्य का आकर्षण एक साथ हैं। तूतनख़ामुन की लगभग अछूती कब्र प्राचीन मिस्र के इतिहास की सबसे प्रसिद्ध खोजों में गिनी जाती है।","where":"यह कथा मिस्र के लक्सर और राजाओं की घाटी से जुड़ी है। तूतनख़ामुन के ख़ज़ाने और स्वर्ण मुखौटे को देखने के लिए दुनिया भर के लोग मिस्र के संग्रहालयों में आते हैं। फ़राओ के श्राप का विचार किताबों और फ़िल्मों में भी लोकप्रिय हुआ।","truth":"कब्र पर किसी श्राप का प्रमाण नहीं मिला। कार्नार्वन की मृत्यु संक्रमण से हुई थी; इसे अलौकिक घटना मानने का कोई विश्वसनीय प्रमाण नहीं है। कब्र खोलने वाले अधिकांश लोग लंबे समय तक जीवित रहे और हॉवर्ड कार्टर भी कई वर्ष बाद तक जीवित थे। कथित चेतावनी को प्रमाणित नहीं किया गया है।","info":[["राजधानी","काहिरा"],["प्रमुख नदी","नील"],["प्रमुख शहर","लक्सर, गीज़ा, अलेक्ज़ेंड्रिया और असवान"],["भाषा","अरबी"],["मुद्रा","मिस्री पाउंड"],["विशेष पहचान","प्राचीन पिरामिड और फ़राओ की सभ्यता"]]}}};

/* Same grouping rule as scripts/generate_story.py (plan_groups) - only used when a story has no saved tile plan. */
function fallbackPlan(n){
  const s = Math.max(1, Math.min(n, Math.max(6, Math.min(11, n))));
  const base = Math.floor(n / s), extra = n % s, out = []; let i = 0;
  for (let k = 0; k < s; k++){ const c = base + (k < extra ? 1 : 0); out.push({p: [i, i + c - 1]}); i += c; }
  return out;
}

/* Every story -> chronological tiles (10-15). Each tile = heading + a slice of the story + an image. Nothing is dropped. */
function buildTiles(s){
  const paras = tr(s, "story") || [];
  const plan = (Array.isArray(s.tiles) && s.tiles.length) ? s.tiles : fallbackPlan(paras.length);
  const n = s.tiles_n || paras.length || 1, r = paras.length / n;
  const pics = imgs(s);
  const tiles = plan.map((t, k) => {
    let a = Math.round(t.p[0] * r), b = Math.round((t.p[1] + 1) * r) - 1;
    if (b < a) b = a;
    const h = t.h ? (t.h[language] || t.h.en || t.h.hi) : L("भाग " + (k + 1), "Part " + (k + 1));
    return {h, text: paras.slice(a, b + 1), img: t.image || pics[k % Math.max(1, pics.length)] || null};
  });
  const pool = tiles.map(t => t.img).filter(Boolean).concat(pics);
  const pick = k => pool.length ? pool[(k * 2 + 1) % pool.length] : null;
  [["why", "🌍", "यह कहानी इतनी मशहूर क्यों है?", "Why is this story famous?"],
   ["where", "📍", "आज यह कहाँ याद की जाती है?", "Where is it remembered?"],
   ["truth", "🔍", "सच और कहानी में फ़र्क", "Fact vs. folklore"]].forEach((c, k) => {
    const txt = tr(s, c[0]); if (txt) tiles.push({h: c[1] + " " + L(c[2], c[3]), text: [txt], img: pick(k + tiles.length), closer: true});
  });

  // Final country card: a visual country/heritage image plus the complete quick-facts panel.
  const facts = tr(s, "info") || [];
  const countryLines = [
    L("देश", "Country") + ": " + (s.flag || "") + " " + s.country,
    ...facts.map(x => (Array.isArray(x) ? x[0] + ": " + x[1] : String(x))),
    tr(s, "where") ? L("कहाँ", "Where") + ": " + tr(s, "where") : "",
    tr(s, "why") ? L("खास बात", "Why it matters") + ": " + tr(s, "why") : "",
    tr(s, "truth") ? L("ऐतिहासिक तथ्य", "Historical note") + ": " + tr(s, "truth") : ""
  ].filter(Boolean);
  tiles.push({
    h: L("देश को जानें · ज़रूरी तथ्य", "Discover the country · Key facts"),
    text: countryLines,
    img: pics[0] || (tiles.find(t => t.img) || {}).img || null,
    closer: true,
    countryCard: true
  });
  return tiles;
}

/* Bento placement for the "All tiles" sheet: every block fills exactly 2 grid rows (desktop, 6 cols) -> no gaps. */
const DBLK = {
  A: [[1,1,4,2],[5,1,2,1],[5,2,2,1]], B: [[1,1,2,1],[1,2,2,1],[3,1,4,2]], C: [[1,1,2,2],[3,1,2,2],[5,1,2,2]],
  E: [[1,1,3,2],[4,1,3,2]], F: [[1,1,2,2],[3,1,4,2]], G: [[1,1,1,1]]
};
function layoutFor(n){
  const blocks = []; let r = n;
  while (r > 0){ if (r === 4 || r === 2){ blocks.push(2); r -= 2; } else if (r >= 3){ blocks.push(3); r -= 3; } else { blocks.push(1); r -= 1; } }
  const out = []; let dRow = 1, mRow = 1, c3 = 0, c2 = 0;
  for (const sz of blocks){
    let d, m;
    if (sz === 3){
      d = DBLK[["A", "C", "B"][c3 % 3]];
      m = c3 % 2 === 0 ? [[1,1,2,2],[1,3,1,2],[2,3,1,2]] : [[1,1,1,2],[2,1,1,2],[1,3,2,2]];
      c3++;
    } else if (sz === 2){
      d = DBLK[c2 % 2 ? "F" : "E"]; m = [[1,1,1,2],[2,1,1,2]]; c2++;
    } else { d = [[1,1,6,2]]; m = [[1,1,2,2]]; }
    d.forEach((t, k) => {
      const mm = m[k];
      out.push({dc: `${t[0]} / span ${t[2]}`, dr: `${dRow + t[1] - 1} / span ${t[3]}`, big: t[2] * t[3] >= 6,
                mc: `${mm[0]} / span ${mm[2]}`, mr: `${mRow + mm[1] - 1} / span ${mm[3]}`, mbig: mm[2] * mm[3] >= 4});
    });
    dRow += 2; mRow += sz === 3 ? 4 : 2;
  }
  return out;
}

function imgFail(i){ if (i.hasAttribute("crossorigin")){ i.removeAttribute("crossorigin"); i.src = i.src; } else i.remove(); }
/* If the photo is bright, switch the heading / glass panel to the dark style (and vice-versa) so text never matches the picture. */
function tone(i){
  const sl = i.closest(".slide"); if (!sl || !i.closest(".m") || !i.hasAttribute("crossorigin")) return;
  try {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const x = c.getContext("2d", {willReadFrequently: true}), w = i.naturalWidth, h = i.naturalHeight;
    x.drawImage(i, 0, h * .5, w, h * .5, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data; let sum = 0;
    for (let p = 0; p < d.length; p += 4) sum += .2126 * d[p] + .7152 * d[p + 1] + .0722 * d[p + 2];
    sl.dataset.tone = (sum / (d.length / 4) / 255) > .58 ? "light" : "dark";
  } catch(e){}
}
const slideImg = im => im ? `<img src="${esc(im.url)}" alt="${esc(capOf(im))}" crossorigin="anonymous" referrerpolicy="no-referrer" decoding="async" onload="tone(this)" onerror="imgFail(this)">` : "";

  ? `<a class="cr" href="${esc(im.source)}" target="_blank" rel="noopener noreferrer" title="${esc(capOf(im))}">📷 ${esc(im.credit)} ↗</a>`
  : `<span class="cr">📷 ${esc(im.credit)}</span>`);
const OPS = ["50% 50%", "30% 40%", "70% 55%", "50% 30%", "40% 60%", "65% 45%"];

function layoutOf(k, hasM, hasS){
  if (!hasM) return ["L1", "L1r", "L3"][k % 3];
  const seq = hasS ? ["L2", "L4", "L2b", "L1r", "L1", "L4"] : ["L1", "L4", "L1r", "L3"];
  return seq[k % seq.length];
}
function secondaryFor(k, m){
  const p = R.pool; if (p.length < 2) return null;
  for (let j = 0; j < p.length; j++){ const c = p[(k * 3 + 1 + j) % p.length]; if (!m || c.url !== m.url) return c; }
  return null;
}

function slideHtml(k){

    <span class="stamp">${pad(k + 1)}</span>${credit(m)}${text}</figure>`;

  if (k < 0) return;
  if (k >= R.tiles.length){ markTile(R.day, R.tiles.length - 1, R.tiles.length); return R.next ? (location.hash = `day-${R.next.day}/1`) : (location.hash = ""); }
  show(k, d);
}

    const nt = R.tiles[k + 1]; if (nt && nt.img){ const pi = new Image(); pi.crossOrigin = "anonymous"; pi.referrerPolicy = "no-referrer"; pi.src = nt.img.url; }

    lockUntil = Date.now() + (reduceMotion ? 0 : 420);

function route(){
  const m = location.hash.match(/^#day-(\d+)(?:\/(\d+))?$/);
  if (!m) return home();
  const day = +m[1], no = m[2] ? +m[2] : 0;
  if (!STORIES.some(s => s.day === day)){
    if (!loaded){ document.body.classList.remove("reading"); app.className = "wrap"; app.innerHTML = `<p class="empty">${L("कहानी लोड हो रही है…", "Loading the story…")}</p>`; return; }
    return home();
  }
  if (R && R.day === day && $("#deck")){ if (no && no - 1 !== R.idx){ lockUntil = 0; show(Math.min(no, R.tiles.length) - 1, no - 1 > R.idx ? 1 : -1); } return; }
  const pos = store.get("pos", {})[day], total = tileTotal(STORIES.find(s => s.day === day));
  mountReader(day, no ? no - 1 : (pos != null && pos < total - 1 ? pos : 0));
}

  .then(r => r.ok ? r.json() : [])
  .then(list => {

        const inl = STORIES.find(x => x.day === +st.day);

        st.day = +st.day; st.info = st.info || []; STORIES.push(st); have.add(st.day); added = true;
      }
    }
    loaded = true;
    if (added){ for (const k in TC) delete TC[k]; if (R && $("#deck")){ const d = R.day, i = R.idx; mountReader(d, i); } else route(); }
    else if (!R) route();
  })
  .catch(() => { loaded = true; if (!R) route(); });
</script>
</body>
</html>
